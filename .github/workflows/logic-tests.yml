name: Logic Tests

on:
  push:
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Configure
        run: >-
          cmake -S . -B build-${{ matrix.build_type }} -G Ninja
          -DICAR_LOGIC_TESTS_ONLY=ON
          -DICAR_BUILD_LOGIC_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build-${{ matrix.build_type }}
      - name: CTest
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 生产主程序配置门：逻辑测试默认关闭。Ubuntu runner 缺少板端依赖
      # （glib/OpenCV/libserial/ppnc/onnx），只有“预期依赖缺失”错误被容忍；
      # CMake语法错误、路径错误等真实故障仍会使该步骤失败。
      - name: Configure production CMake (dependency gate)
        shell: bash
        run: |
          set +e
          cmake -S . -B build-production-config \
            -DICAR_BUILD_LOGIC_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee production-config.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eiq "ppnc|onnx|libserial|OpenCV|glib" production-config.log; then
            echo "Expected board dependency failure."
            exit 0
          fi
          echo "Unexpected CMake configuration failure."
          exit "$status"
